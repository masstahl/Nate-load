<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transload Tracker</title>
<style>
:root{
  --bg:#f4f4f3; --card:#ffffff; --text:#1c1c1e; --muted:#75757b; --border:#e3e3e6;
  --accent:#0e7490;
  --pasco:#0891b2; --warden:#7c3aed; --quincy:#d97706;
  --danger:#dc2626; --good:#16a34a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111113; --card:#1c1c1f; --text:#f2f2f2; --muted:#9a9aa0; --border:#2e2e32; }
}
:root[data-theme="dark"]{ --bg:#111113; --card:#1c1c1f; --text:#f2f2f2; --muted:#9a9aa0; --border:#2e2e32; }
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:14px 14px calc(30px + env(safe-area-inset-bottom,0px));
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  max-width:520px;margin-left:auto;margin-right:auto;
}
h1{font-size:19px;margin:0 0 2px;}
h2{font-size:14px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
.muted{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;}
.hint{color:var(--muted);font-size:12.5px;margin:-4px 0 10px;}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
input[type=text],input[type=number],input[type=date]{
  width:100%;border:1px solid var(--border);background:var(--bg);color:var(--text);
  border-radius:10px;padding:10px;font-size:16px;
}
.btn{border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-primary{background:var(--accent);color:#fff;}
.btn.full{width:100%;margin-top:10px;}
.icon-btn{background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;width:40px;height:40px;font-size:18px;}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.date-nav{display:flex;align-items:center;gap:8px;flex:1;}
.date-input{flex:1;text-align:center;}
.link-btn{background:none;border:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 4px;}
.status{font-size:13px;color:var(--danger);margin-bottom:10px;}
.order-inputs{display:flex;gap:8px;margin-bottom:4px;}
.order-field{flex:1;}
.order-field label{font-weight:600;}
.progress-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;}
.pcard .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
.pcard .name{font-weight:700;font-size:14px;}
.pcard .nums{font-size:13px;color:var(--muted);}
.pcard .remaining{font-size:22px;font-weight:800;}
.track{height:8px;border-radius:6px;background:var(--bg);border:1px solid var(--border);overflow:hidden;margin-top:6px;}
.fill{height:100%;border-radius:6px;}
.form-row2{display:flex;gap:8px;margin-bottom:10px;}
.form-row2>div{flex:1;}
.field-split{display:flex;align-items:center;gap:6px;}
.field-split input{text-align:center;}
.field-split span{color:var(--muted);font-weight:700;}
.dest-toggle{display:flex;gap:8px;margin-bottom:4px;}
.dest-btn{flex:1;border:2px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 0;font-weight:700;font-size:13px;}
.dest-btn.active{border-color:var(--c);color:var(--c);}
.dest-btn[data-dest="pasco"].active{background:rgba(8,145,178,.16);}
.dest-btn[data-dest="warden"].active{background:rgba(124,58,237,.16);}
.dest-btn[data-dest="quincy"].active{background:rgba(217,119,6,.16);}
.load-list{display:flex;flex-direction:column;gap:6px;}
.load-item{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:9px 10px;}
.load-item .badge{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.load-item .info{flex:1;font-size:13.5px;line-height:1.35;}
.load-item .info b{font-size:14.5px;}
.load-item .dest-label{font-size:11.5px;color:var(--muted);}
.del-btn{background:none;border:none;color:var(--muted);font-size:18px;padding:2px 6px;}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}
.trend{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px;}
.tbar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
.tbar-num{font-size:11px;color:var(--muted);margin-bottom:3px;}
.tbar{width:100%;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px;}
.tbar.sel{background:var(--quincy);}
.tbar-day{font-size:10px;color:var(--muted);margin-top:4px;}
.subhead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px;}
.field-trend-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px;}
.field-trend-item:last-child{border-bottom:none;}
.field-trend-item .count{font-weight:700;}
.field-summary{
  border:1px solid var(--border);
  border-radius:10px;
  padding:10px;
  margin-bottom:8px;
}

.field-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:700;
}

.field-destination{
  display:flex;
  justify-content:space-between;
  margin-top:4px;
  font-size:13px;
  padding-left:18px;
}

.field-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}.field-chart{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.field-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.field-label{
  width:60px;
  font-size:13px;
  font-weight:700;
  flex-shrink:0;
}

.field-bar-wrap{
  flex:1;
  height:24px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:999px;
  overflow:hidden;
}

.field-bar{
  height:100%;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding-right:8px;
  color:white;
  font-size:12px;
  font-weight:700;
  min-width:40px;
}


.footer-note{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:4px;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>🚚 Transload Tracker</h1>
  </div>
  <button id="todayBtn" class="link-btn">Today</button>
</header>

<div class="date-nav" style="margin-bottom:12px;">
  <button id="prevDay" class="icon-btn">‹</button>
  <input type="date" id="dateInput" class="date-input">
  <button id="nextDay" class="icon-btn">›</button>
</div>

<div id="statusMsg" class="status" style="display:none;"></div>

<section class="card">
  <h2>Log a Load</h2>
  <div class="form-row2">
    <div><label>Truck #</label><input type="text" id="fTruck" inputmode="numeric" list="truckList" autocomplete="off"></div>
    <div><label>Trailer #</label><input type="text" id="fTrailer" inputmode="numeric" list="trailerList" autocomplete="off"></div>
  </div>
  <div class="form-row2">
    <div>
      <label>Field</label>
      <div class="field-split">
        <input type="text" id="fFieldA" inputmode="numeric" list="fieldAList" autocomplete="off" placeholder="4">
        <span>–</span>
        <input type="text" id="fFieldB" inputmode="numeric" list="fieldBList" autocomplete="off" placeholder="1">
      </div>
      <datalist id="fieldAList"></datalist>
      <datalist id="fieldBList"></datalist>
    </div>
    <div><label>Variety</label><input type="text" id="fVariety" list="varietyList" autocomplete="off"></div>
  </div>
  <datalist id="truckList"></datalist>
  <datalist id="trailerList"></datalist>
  <datalist id="varietyList"></datalist>
  <label>Destination</label>
  <div class="dest-toggle" id="destToggle">
    <button type="button" class="dest-btn" data-dest="pasco" style="--c:var(--pasco)">Pasco</button>
    <button type="button" class="dest-btn" data-dest="warden" style="--c:var(--warden)">Warden</button>
    <button type="button" class="dest-btn" data-dest="quincy" style="--c:var(--quincy)">Quincy</button>
  </div>
  <button id="addLoad" class="btn btn-primary full">Add Load</button>
</section>

 <section id="progressCards" class="progress-grid"></section>

<section class="card">
  <h2>Loads <span id="dayTotal" class="muted"></span></h2>
  <div id="loadList" class="load-list"></div>
</section>
  

  
<section class="card">
  <h2>Today's Orders</h2>
  <p class="hint">Numbers from the morning text — how many loads each plant wants.</p>
  <div class="order-inputs">
    <div class="order-field"><label style="color:var(--pasco)">Pasco</label><input type="number" min="0" id="orderPasco" inputmode="numeric"></div>
    <div class="order-field"><label style="color:var(--warden)">Warden</label><input type="number" min="0" id="orderWarden" inputmode="numeric"></div>
    <div class="order-field"><label style="color:var(--quincy)">Quincy</label><input type="number" min="0" id="orderQuincy" inputmode="numeric"></div>
  </div>
  <button id="saveOrders" class="btn btn-primary full">Save Orders</button>
</section>



<section class="card">
  <h2>Last 7 Days</h2>
  <div id="trend" class="trend"></div>
  <div class="subhead">Field Summary (Last 30 Days)</div>
<div id="fieldTrend"></div>

</section>

<p class="footer-note">Data is saved only in this browser, on this device.</p>

<script>
let storageOK = true;
let currentDate = todayISO();
let selectedDest = null;

function isoDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,delta){ const dt=parseISO(s); dt.setDate(dt.getDate()+delta); return isoDate(dt); }
function todayISO(){ return isoDate(new Date()); }
function fmtLabel(s){ const dt=parseISO(s); return dt.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
function genId(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2)); }

function showStatus(msg){ const el=document.getElementById('statusMsg'); el.textContent=msg; el.style.display='block'; }
function hideStatus(){ document.getElementById('statusMsg').style.display='none'; }

// --- local storage data layer ---
function readJSON(key, fallback){
  try{ const raw=localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ storageOK=false; return fallback; }
}
function writeJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ storageOK=false; return false; }
}
function getLoads(){ return readJSON('tt_loads', []); }
function setLoads(arr){ return writeJSON('tt_loads', arr); }
function getOrders(){ return readJSON('tt_orders', {}); }
function setOrders(obj){ return writeJSON('tt_orders', obj); }
function lastUsed(){ return readJSON('tt_last', {}); }
function saveLastUsed(fieldA,fieldB,variety){ writeJSON('tt_last', {fieldA,fieldB,variety}); }
function cleanupOldLoads(){

  const cutoff =
    Date.now() -
    (30 * 24 * 60 * 60 * 1000);

  const cleaned =
    getLoads().filter(
      l => (l.ts || 0) >= cutoff
    );

  setLoads(cleaned);
}

document.getElementById('dateInput').addEventListener('change', e=>{ currentDate=e.target.value; refresh(); });
document.getElementById('prevDay').addEventListener('click', ()=>{ setDate(addDays(currentDate,-1)); });
document.getElementById('nextDay').addEventListener('click', ()=>{ setDate(addDays(currentDate,1)); });
document.getElementById('todayBtn').addEventListener('click', ()=>{ setDate(todayISO()); });

document.querySelectorAll('.dest-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    selectedDest = btn.dataset.dest;
    document.querySelectorAll('.dest-btn').forEach(b=>b.classList.toggle('active', b===btn));
  });
});

document.getElementById('addLoad').addEventListener('click', ()=>{
  const truck=document.getElementById('fTruck').value.trim();
  const trailer=document.getElementById('fTrailer').value.trim();
  const fieldA=document.getElementById('fFieldA').value.trim();
  const fieldB=document.getElementById('fFieldB').value.trim();
  const field = fieldA && fieldB ? `${fieldA}-${fieldB}` : (fieldA || fieldB || '');
  const variety=document.getElementById('fVariety').value.trim();
  if(!truck || !trailer){ showStatus('Enter a truck and trailer number.'); return; }
  if(!selectedDest){ showStatus('Pick a destination.'); return; }
  hideStatus();
  const loads=getLoads();
  loads.push({id:genId(), date:currentDate, truck, trailer, field, variety, dest:selectedDest, ts:Date.now()});
  if(!setLoads(loads)){ showStatus('Could not save — your browser may be blocking storage.'); return; }
  saveLastUsed(fieldA,fieldB,variety);
  document.getElementById('fTruck').value='';
  document.getElementById('fTrailer').value='';
  selectedDest=null;
  document.querySelectorAll('.dest-btn').forEach(b=>b.classList.remove('active'));
  refresh();
});

document.getElementById('saveOrders').addEventListener('click', ()=>{
  const pasco=Number(document.getElementById('orderPasco').value)||0;
  const warden=Number(document.getElementById('orderWarden').value)||0;
  const quincy=Number(document.getElementById('orderQuincy').value)||0;
  hideStatus();
  const orders=getOrders();
  orders[currentDate]={pasco, warden, quincy};
  if(!setOrders(orders)){ showStatus('Could not save orders — your browser may be blocking storage.'); return; }
  refresh();
});

function setDate(d){
  currentDate=d;
  document.getElementById('dateInput').value=d;
  refresh();
}

function deleteLoad(id){
  const loads=getLoads().filter(l=>l.id!==id);
  setLoads(loads);
  refresh();
}

function destColor(d){ return d==='pasco'?'var(--pasco)':d==='warden'?'var(--warden)':'var(--quincy)'; }
function destLabel(d){ return d==='pasco'?'Pasco':d==='warden'?'Warden':'Quincy'; }
function getFieldColor(field){

  const colors=[
    '#0891b2',
    '#7c3aed',
    '#d97706',
    '#dc2626',
    '#16a34a',
    '#2563eb',
    '#db2777',
    '#ea580c'
  ];

  let hash=0;

  for(let i=0;i<field.length;i++){
    hash+=field.charCodeAt(i);
  }

  return colors[
    hash % colors.length
  ];
}

function renderProgress(loadsByDest, orders){

  const wrap =
    document.getElementById('progressCards');

  wrap.innerHTML='';

  const destinations=[
    'pasco',
    'warden',
    'quincy'
  ];

  destinations.sort((a,b)=>{

    const remainingA =
      Math.max(
        (orders[a]||0) -
        (loadsByDest[a]||0),
        0
      );

    const remainingB =
      Math.max(
        (orders[b]||0) -
        (loadsByDest[b]||0),
        0
      );

    return remainingB - remainingA;
  });

  destinations.forEach(d=>{

    const loaded =
      loadsByDest[d] || 0;

    const ordered =
      orders[d] || 0;

    const remaining =
      Math.max(
        ordered-loaded,
        0
      );

    const pct =
      ordered > 0
        ? Math.min(
            loaded/ordered*100,
            100
          )
        : 0;

    const div =
      document.createElement('div');

    div.className='pcard';

    div.innerHTML=`

      <div class="top">

        <span
          class="name"
          style="color:${destColor(d)}">

          ${destLabel(d)}

        </span>

        <span class="nums">

          ${loaded} of ${ordered} loaded

        </span>

      </div>

      <div
        class="remaining"
        style="
          color:${
            remaining>0
              ? 'var(--danger)'
              : 'var(--good)'
          };
        ">

        ${
          remaining>0
            ? remaining + ' left'
            : (
                ordered>0
                ? 'Complete'
                : '—'
              )
        }

      </div>

      <div class="track">

        <div
          class="fill"
          style="
            width:${pct}%;
            background:${destColor(d)};
          ">
        </div>

      </div>

    `;

    wrap.appendChild(div);

  });

}

function renderLoadList(loads){
  const list=document.getElementById('loadList');
  document.getElementById('dayTotal').textContent = loads.length ? `(${loads.length} total)` : '';
  if(!loads.length){ list.innerHTML='<div class="empty">No loads logged for this day yet.</div>'; return; }
  list.innerHTML='';
  loads.slice().sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(l=>{
    const row=document.createElement('div');
    row.className='load-item';
    row.innerHTML=`
      <div class="badge" style="background:${destColor(l.dest)}"></div>
      <div class="info"><b>${l.truck} / ${l.trailer}</b> — ${l.field||''} ${l.variety||''}<br><span class="dest-label">${destLabel(l.dest)}</span></div>
      <button class="del-btn" aria-label="Delete">✕</button>
    `;
    row.querySelector('.del-btn').addEventListener('click', ()=>deleteLoad(l.id));
    list.appendChild(row);
  });
}

function renderTrend(counts){

function renderFieldTotals(allLoads){

  const container =
    document.getElementById('fieldTrend');

  const totals = {};

  allLoads.forEach(load=>{

    if(!load.field) return;

    totals[load.field] =
      (totals[load.field] || 0) + 1;

  });

  const fields =
    Object.entries(totals)
      .sort((a,b)=>b[1]-a[1]);

  if(!fields.length){

    container.innerHTML =
      '<div class="empty">No field data yet.</div>';

    return;
  }

  const max =
    Math.max(
      ...fields.map(
        ([,count]) => count
      ),
      1
    );

  container.className =
    'field-chart';

  container.innerHTML='';

  fields.forEach(([field,count])=>{

    const percent =
      (count/max) * 100;

    const color =
      getFieldColor(field);

    const row =
      document.createElement('div');

    row.className =
      'field-row';

    row.innerHTML = `

      <div class="field-label">

        ${field}

      </div>

      <div class="field-bar-wrap">

        <div
          class="field-bar"
          style="
            width:${percent}%;
            background:${color};
          ">

          ${count}

        </div>

      </div>

    `;

    container.appendChild(row);

  });

}


  const el=document.getElementById('trend');
  const dates=Object.keys(counts).sort().slice(-7);
  if(!dates.length){ el.innerHTML='<div class="empty">No history yet.</div>'; return; }
  const max=Math.max(...dates.map(d=>counts[d]),1);
  el.innerHTML='';
  dates.forEach(d=>{
    const h=Math.max((counts[d]/max)*90, counts[d]>0?6:0);
    const wrap=document.createElement('div');
    wrap.className='tbar-wrap';
    wrap.innerHTML=`
      <div class="tbar-num">${counts[d]}</div>
      <div class="tbar ${d===currentDate?'sel':''}" style="height:${h}px"></div>
      <div class="tbar-day">${fmtLabel(d)}</div>
    `;
    el.appendChild(wrap);
  });
}

function populateDatalist(id, values){
  const dl=document.getElementById(id);
  dl.innerHTML='';
  values.forEach(v=>{ const opt=document.createElement('option'); opt.value=v; dl.appendChild(opt); });
}

function populateDatalists(allLoads){
  const seen={truck:new Set(), trailer:new Set(), fieldA:new Set(), fieldB:new Set(), variety:new Set()};
  allLoads.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(l=>{
    if(l.truck) seen.truck.add(l.truck);
    if(l.trailer) seen.trailer.add(l.trailer);
    if(l.field){ const parts=String(l.field).split('-'); if(parts[0]) seen.fieldA.add(parts[0]); if(parts[1]) seen.fieldB.add(parts[1]); }
    if(l.variety) seen.variety.add(l.variety);
  });
  populateDatalist('truckList', [...seen.truck]);
  populateDatalist('trailerList', [...seen.trailer]);
  populateDatalist('fieldAList', [...seen.fieldA]);
  populateDatalist('fieldBList', [...seen.fieldB]);
  populateDatalist('varietyList', [...seen.variety]);
}

function refresh(){
  const allLoads=getLoads();
  const loads=allLoads.filter(l=>l.date===currentDate);
  const loadsByDest={};
  loads.forEach(l=>{ loadsByDest[l.dest]=(loadsByDest[l.dest]||0)+1; });
  const orders=(getOrders())[currentDate] || {};
  document.getElementById('orderPasco').value = orders.pasco ?? '';
  document.getElementById('orderWarden').value = orders.warden ?? '';
  document.getElementById('orderQuincy').value = orders.quincy ?? '';
  renderProgress(loadsByDest, orders);
  renderLoadList(loads);
  populateDatalists(allLoads);

  const counts={};
  allLoads.forEach(l=>{ counts[l.date]=(counts[l.date]||0)+1; });
  counts[currentDate]=counts[currentDate]||0;
  renderTrend(counts);
  renderFieldTotals(allLoads);


  if(!storageOK) showStatus('Your browser is blocking local storage — data won\'t be saved.');
  else hideStatus();
}

function init(){

  cleanupOldLoads();

  document.getElementById('dateInput').value=currentDate;

  const last=lastUsed();

  if(last.fieldA)
    document.getElementById('fFieldA').value=last.fieldA;

  if(last.fieldB)
    document.getElementById('fFieldB').value=last.fieldB;

  if(last.variety)
    document.getElementById('fVariety').value=last.variety;

  refresh();

}

init();
</script>
</body>
</html>
